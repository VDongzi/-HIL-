<style>
/* fonts: titles = ClashVector Medium (Latin) + Noto Sans CJK SC Medium (Chinese);

@font-face{font-family:"VTitleEN";src:local("ClashVector Medium"),local("ClashVector-Medium");font-weight:100 900}
@font-face{font-family:"VTitleCN";src:local("Noto Sans CJK SC Medium"),local("NotoSansCJKsc-Medium");font-weight:100 900}
@font-face{font-family:"VBodyEN";src:local("Inter Regular"),local("Inter-Regular");font-weight:100 900}
@font-face{font-family:"VBodyCN";src:local("Noto Sans CJK SC Regular"),local("NotoSansCJKsc-Regular");font-weight:100 900}
/* real bold faces (Inter Bold + Noto Sans CJK SC Bold) instead of a synthetic bold of the regular faces; used via class "bd" */

*{box-sizing:border-box;margin:0;padding:0;font-synthesis:none}
html,body{height:100%;background:#24262D;overflow:hidden;font-family:var(--fb)}
#wrap{position:fixed;inset:0 0 64px 0}

/* hidden controls come back as an overlay when the mouse moves to the bottom edge (not while recording) */
body.clean.peek #ctl{display:flex;z-index:40}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background-color:#fff;overflow:hidden;cursor:pointer;transition:background-color .9s ease}
#stage::before{content:"";position:absolute;inset:0;transition:opacity .9s ease;will-change:opacity;
  background-image:radial-gradient(ellipse 60% 55% at 50% 45%,rgba(255,255,255,.95),rgba(255,255,255,0)),radial-gradient(rgba(95,104,126,.14) 1.4px,transparent 1.6px),linear-gradient(rgba(224,226,232,.4),rgba(224,226,232,.4));background-size:100% 100%,36px 36px,100% 100%}

#amb i:nth-child(1){width:900px;height:900px;left:-310px;top:-270px;background:#7D8FDE}

#amb i:nth-child(3){width:600px;height:600px;right:calc(18% - 90px);top:-290px;background:#FA5146;opacity:.09;animation-delay:-17s}

#stage.white::before,#stage.white #amb,#stage.dark::before,#stage.dark #amb{opacity:0}

.scene{position:absolute;inset:0;animation:sceneIn 1s cubic-bezier(.22,1,.36,1) both;will-change:opacity,transform}
@keyframes sceneIn{from{opacity:0;transform:scale(1.025)}}

/* reveal system */
/* no blur on reveals: SVG filters are repainted on the CPU every frame and stall the picture at full resolution */
.r{opacity:0;transition:opacity .9s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
.r.up{transform:translateY(26px)}.r.left{transform:translateX(-40px)}.r.right{transform:translateX(40px)}
.r.pop{transform:scale(.82)}.r.grow{transform:scaleX(0);transform-origin:left center}
.r.on{opacity:1;transform:none;filter:none}
.r:not(.on),.r:not(.on) .dr{transition-delay:0s!important} /* delays only when appearing, so stepping back hides at once */
.r.draw .dr{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.5s cubic-bezier(.65,0,.35,1) var(--d,0s)}
.r.draw.on .dr{stroke-dashoffset:0}

.flow{stroke-dasharray:16 14;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-30}}
.dashline{stroke-dasharray:14 12}
.spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
.spin.fast{animation-duration:.9s}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.08);opacity:.65}}
.flick{animation:flick .12s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}
@keyframes flick{to{transform:scaleY(1.3)}}
.rk{transition:transform 2.4s cubic-bezier(.55,0,.85,.55),opacity .25s ease 2.25s}
.rk.launch{transform:translateY(-380px);opacity:0}
.beam{fill:#33D3FF;opacity:.35;transition:fill .6s,opacity .6s}
.beam.danger{fill:#F62634;opacity:.6;animation:blink .7s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.shake{animation:shake .45s ease 3;transform-box:fill-box}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.bar2{transition:width 1.6s cubic-bezier(.3,.8,.3,1) .5s}
.bar2.short{width:760px}
.cn{transition:fill .5s,stroke .5s}
.cn.hlNode{fill:rgba(0,173,147,.1);stroke:#00AD93}
.ce{transition:stroke .5s}
.ce.hlEdge{stroke:#00AD93;marker-end:url(#ah-green)}
.cn:not(.hlNode),.ce:not(.hlEdge){transition-delay:0s!important}
/* branch coverage: each decision outcome is traced in orange, then softly pulses */
.brh{opacity:0;stroke-dasharray:1;stroke-dashoffset:1}
.brh.go{animation:brTrace .7s cubic-bezier(.65,0,.35,1) both,brPulse 1.6s ease-in-out .7s infinite}
@keyframes brTrace{from{opacity:1;stroke-dashoffset:1}to{opacity:1;stroke-dashoffset:0}}
@keyframes brPulse{0%,100%{opacity:1}50%{opacity:.55}}
.brl text{transition:fill .4s}
.brl.go text{fill:#FA5146;font-weight:800;transition-delay:var(--bd)}
.hb{transition:fill .5s,fill-opacity .5s}
.hb.hot{fill:#D5112A;fill-opacity:.55}
.glow{filter:drop-shadow(0 0 22px rgba(213,17,42,.6));transition:filter .5s}
.hx{transition:transform 1.2s cubic-bezier(.65,0,.35,1),opacity .7s ease .2s;transform-box:fill-box;transform-origin:left center}
.hxinit .hx{transition:none}
.hwm,.swm{transition:transform 1.2s cubic-bezier(.65,0,.35,1) .3s;transform-box:fill-box;transform-origin:center}
.hwm.merge{transform:translate(-280px,0)}
.swm.merge{transform:translate(260px,0) scale(.3)}
.fadem{transition:opacity .5s}.fadem.merge{opacity:0}
.led{animation:blink .8s ease-in-out infinite}
/* shift-left morph: same 4-segment structure in both shapes (the traditional outline split at its first segment's midpoint) */
.morphL{d:path("M124,406 C262,400 391,392 503,379.5 C615,367 710,350 780,326 C870,288 900,140 960,140 C1030,140 1080,300 1150,406");stroke:#5F687E;transition:d 2s cubic-bezier(.65,0,.35,1) .6s,stroke 1.6s ease .8s}
.r.on .morphL{d:path("M124,406 C230,394 270,330 320,252 C380,152 520,142 600,222 C660,292 700,330 880,338 C1040,345 1100,360 1150,406");stroke:#D5112A}
.fix .fb,.fix .fc{opacity:0;transform-box:fill-box;transform-origin:center}
.fix.go .fb{animation:fixBug 2s ease var(--fd) both}
@keyframes fixBug{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.12)}20%,62%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.15)}}
.fix.go .fc{animation:fixChk 1.5s ease calc(var(--fd) + .95s) both}
@keyframes fixChk{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}35%,75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.6)}}
.btnp{transition:transform .12s ease;transform-box:fill-box;transform-origin:center}.btnp.down{transform:scale(.78)}
#pressRing.ping{animation:ping .5s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.envdot{fill:#FFA900;transition:fill .5s ease var(--vd)}.envdot.in{fill:#028EED}.envdot.real{fill:#00AD93}
.unk{transition:opacity .5s ease}.unk.gone{opacity:0}
.sweat{animation:sweat 1.35s ease-in infinite;transform-box:fill-box;transform-origin:center}
@keyframes sweat{0%{opacity:0;transform:translateY(-4px) scale(.6)}20%{opacity:1;transform:none}80%{opacity:1;transform:translateY(16px)}100%{opacity:0;transform:translateY(22px)}}
/* 尽早验证: a hand reaches down and flicks the real car away, then grabs the simulated car at the left and drags it into place (4.2 s) */
.pushout.go{animation:carFlick 4.2s both}
@keyframes carFlick{0%,11%{transform:none;animation-timing-function:cubic-bezier(.5,0,.9,.4)}26%,100%{transform:translateX(1400px) rotate(4deg)}}
.pullin{opacity:0}.pullin.go{animation:simDrag 4.2s both}
@keyframes simDrag{0%,29%{opacity:0;transform:translateX(-1150px)}32%{opacity:1;transform:translateX(-1150px);animation-timing-function:cubic-bezier(.45,0,.3,1)}64%,100%{opacity:1;transform:none}}
.hand2{opacity:0}.hand2.go{animation:handMove 4.2s both}
@keyframes handMove{
  0%{opacity:1;transform:translate(640px,-300px);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  8%{transform:translate(650px,440px);animation-timing-function:cubic-bezier(.6,0,.2,1)}
  11%,16%{transform:translate(715px,430px);animation-timing-function:cubic-bezier(.45,0,.3,1)}
  29%,32%{transform:translate(150px,300px);animation-timing-function:cubic-bezier(.45,0,.3,1)}
  64%,68%{transform:translate(1300px,300px);animation-timing-function:cubic-bezier(.5,0,.8,.4)}
  84%,100%{opacity:1;transform:translate(1300px,-420px)}}
.hand2 .hp{animation:poseP 4.2s both}.hand2 .hg{opacity:0;animation:poseG 4.2s both}
@keyframes poseP{0%,28%{opacity:1}29%,67%{opacity:0}68%,100%{opacity:1}}
@keyframes poseG{0%,28%{opacity:0}29%,67%{opacity:1}68%,100%{opacity:0}}
.cut{transition:opacity .6s ease}.cut.off{opacity:0;transition-delay:2.4s}.cut.late.off{transition-delay:3.4s}
.kill{transition:opacity .9s ease,transform .9s cubic-bezier(.5,0,.75,0),filter .9s ease;transform-box:fill-box;transform-origin:center}.kill.off{opacity:0;transform:scale(.3);filter:grayscale(1);transition-delay:3.2s}
.vn .bg{fill:#fff;stroke:#E0E2E8;transition:fill .6s ease var(--vd),stroke .6s ease var(--vd)}
.vn .ic{stroke:rgba(95,104,126,.62);transition:stroke .6s ease var(--vd)}
.vn .ck{opacity:0;transition:opacity .5s ease var(--vd)}
.vn.ok .bg{fill:rgba(0,173,147,.1);stroke:#00AD93}.vn.ok .ic{stroke:#00AD93}.vn.ok .ck{opacity:1}
.ripple{animation:ripple 1.8s cubic-bezier(.22,1,.36,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(var(--sx,1.16),var(--sy,1.4))}}
.dep{transition:opacity .9s ease 1.4s}.dep.less{opacity:.3}
.meter{transition:width 1.2s cubic-bezier(.3,.8,.3,1) 1.4s}.meter.less{width:70px}
.needle{transform-box:view-box;transform-origin:0 0;transform:rotate(-28deg);transition:transform 1.4s cubic-bezier(.5,0,.2,1.15) .8s}
.needle.low{transform:rotate(-152deg)}
.drive{transform:translateX(-1200px);transition:transform 1.6s cubic-bezier(.2,.8,.25,1)}.drive.go{transform:none}
.roadflow{animation:roadflow .5s linear infinite}
@keyframes roadflow{to{stroke-dashoffset:60}}
.posts{animation:posts .9s linear infinite}
@keyframes posts{to{transform:translateX(-200px)}}
.bob{animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.sigw path{animation:sigw 1.2s ease-out infinite;opacity:0}
@keyframes sigw{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.spd{animation:spd .6s linear infinite}
@keyframes spd{0%{transform:translateX(30px);opacity:0}40%{opacity:1}100%{transform:translateX(-40px);opacity:0}}
.cycspin{animation:spin 2s linear infinite;transform-box:fill-box;transform-origin:center}

@keyframes bump{0%{transform:scale(1.35)}100%{transform:scale(1)}}

@keyframes typeline{0%{transform:scaleX(0)}45%,85%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:.2}}
.sig{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:10 70;animation:sigflow 1.2s linear infinite}

/* opening: clean white logo reveal */
#stage.dark{background:#0B1B51}
/* brand gradient (Black -> Blue 500 -> Primary Red, bands at 30deg) for the opening, agenda, chapter titles and ending */
#grad{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;background:linear-gradient(150deg,#000 0%,#0B1B51 45%,#F62634 88%)}
#stage.grad #grad{opacity:1}
#stage.grad::before,#stage.grad #amb{opacity:0}
#brand path{transition:fill .9s}
#stage.grad #brand path{fill:#fff}
.scene.g text[fill="#24262D"],.scene.g tspan[fill="#24262D"]{fill:#fff}
.scene.g text[fill="rgba(246,38,52,.1)"]{fill:rgba(255,255,255,.1)}
#stage.white{background:#fff}
#hdr{transition:opacity .6s}
#stage.dark #hdr,#stage.white #hdr,#stage.full #hdr{opacity:0}
/* full-frame scene: draws over the whole 1920×1080 stage (its SVG content reaches above and below the 800-high scene box) */
.scene.full svg{overflow:visible}
/* contents page: the active chapter row grows and turns red in place */
.tocr .ttl,.tocr .num{transform-box:fill-box;transition:transform .9s cubic-bezier(.22,1,.36,1),fill .7s ease}
.tocr .ttl{transform-origin:left center}.tocr .num{transform-origin:right center}
.tocr.act .ttl{transform:scale(1.25);fill:#F62634}
.tocr.act .num{transform:scale(1.3)}
/* title page background picture: shown in its final state at once, then a slow, slight zoom while the title is up */
.bgz .r,.bgz .r *{transition:none!important}
.bgz{transform-box:view-box;transform-origin:960px 400px}
.r.on .bgz{animation:bgz 9s linear both}
@keyframes bgz{from{transform:scale(1)}to{transform:scale(1.08)}}
/* own chapter-cover picture (measured from the reference clip): hard cut in, a centred push-in to ~2× that brakes to a stop
   by ~2.5 s, radial zoom-blur that is strongest at the cut and clears by ~3 s, colour draining to black-and-white 0.3–2.4 s */
.r.on .bgz.cvz{animation:cvZoom 2.5s linear both,cvGrey 2.1s cubic-bezier(.4,0,.6,1) .3s both}
@keyframes cvZoom{0%{transform:scale(1)}12%{transform:scale(1.27)}20%{transform:scale(1.41)}36%{transform:scale(1.69)}
  48%{transform:scale(1.84)}60%{transform:scale(1.93)}80%{transform:scale(2)}100%{transform:scale(2.04)}}
/* scene-copy covers: the same push-in curve, but only to 1.4× so the recentred picture stays in frame */
.r.on .bgz.cvz.cvs{animation-name:cvZoomS,cvGrey}
@keyframes cvZoomS{0%{transform:scale(1)}12%{transform:scale(1.119)}20%{transform:scale(1.176)}36%{transform:scale(1.281)}
  48%{transform:scale(1.334)}60%{transform:scale(1.364)}80%{transform:scale(1.387)}100%{transform:scale(1.4)}}
@keyframes cvGrey{from{filter:grayscale(0)}to{filter:grayscale(1)}}
.cvZb{transform-box:view-box;transform-origin:960px 400px}
.r.on .cvZb{animation:cvZb 3s cubic-bezier(.25,.5,.45,1) both}
@keyframes cvZb{from{transform:scale(var(--k));opacity:var(--o)}to{transform:scale(1);opacity:0}}
.r.on .cvSh{animation:cvSh 2s cubic-bezier(.3,.4,.5,1) both}
@keyframes cvSh{from{opacity:.25}to{opacity:1}}
/* chapter-cover title: appears 0.1 s after the cut already at ~60 % and grows to full size by 0.45 s; the quote marks
   grow the same way, pinned at their outer edges */
.tcIn{transform-box:view-box}
.r.on .tcIn{animation:tcIn .45s linear both}
@keyframes tcIn{0%,21%{opacity:0;transform:scale(.59)}22%{opacity:1;transform:scale(.59)}67%{transform:scale(.88)}100%{opacity:1;transform:scale(1)}}
.ifade{animation:ifade 1.4s cubic-bezier(.2,.8,.2,1) .35s both;transform-box:fill-box;transform-origin:center}
@keyframes ifade{from{opacity:0;transform:scale(.55);filter:blur(14px)}}
.imove{animation:imove 1.5s cubic-bezier(.7,0,.2,1) 1.7s both}
@keyframes imove{from{transform:translateX(-888px)}}
.ilet{animation:ilet 1.3s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
@keyframes ilet{from{opacity:0;transform:translateY(70px);filter:blur(12px)}}
.isub{animation:isub 1.6s cubic-bezier(.2,.8,.2,1) 3.2s both}
@keyframes isub{from{opacity:0;letter-spacing:70px}}
/* topic line: the logo softly fades away and the title takes the centre on its own */
.lg{transition:opacity .8s ease,transform 1s cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:center}
.lg.up{opacity:0;transform:scale(.94)}
.olet{animation:olIn 1s cubic-bezier(.22,1,.36,1) both}
@keyframes olIn{from{opacity:0;filter:blur(12px)}}
.ozoom{animation:ozoom 2.6s cubic-bezier(.45,0,.2,1) 2.4s forwards;transform-box:fill-box;transform-origin:center}
@keyframes ozoom{to{transform:scale(1.4)}}

/* MP4 export */
body.rec #ctl,body.rec #bar{display:none}
body.rec #wrap{bottom:0}
body.rec,body.rec #stage{cursor:none}
#recBox{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(11,27,81,.55);backdrop-filter:blur(6px);font-family:var(--fb)}
#recBox .card{background:#fff;border-radius:22px;padding:34px 40px;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);color:#24262D;font-size:16px;line-height:1.7}
#recBox h3{font-family:var(--ft);font-weight:500;font-size:24px;margin-bottom:12px}
#recBox ol{margin:10px 0 22px 20px}

#recBox .go{background:#D5112A;color:#fff}#recBox .no{background:#E0E2E8;color:#24262D}
#recBox .msg{color:#D5112A;margin-top:12px;min-height:1.4em}

/* controls */
#ctl{position:fixed;left:0;right:0;bottom:0;height:64px;background:#24262D;color:#E0E2E8;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14px;user-select:none}
#ctl button{background:#24262D;color:#E0E2E8;border:1px solid #3C4655;border-radius:8px;height:38px;min-width:38px;padding:0 10px;font-size:16px;cursor:pointer}
#ctl button:hover{background:#3C4655}
#ctl button.main{background:#D5112A;border-color:#D5112A;min-width:52px}
#prog{flex:1;height:10px;background:#3C4655;border-radius:5px;position:relative;cursor:pointer}
#prog i{position:absolute;left:0;top:0;bottom:0;background:#D5112A;border-radius:5px}
#prog b{position:absolute;top:-4px;width:2px;height:18px;background:rgba(95,104,126,.62)}
#time{font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
#ctl select,#ctl label{background:#24262D;color:#E0E2E8;border:1px solid #3C4655;border-radius:8px;height:38px;padding:0 8px;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="grad"></div>
  <div id="amb"><i></i><i></i><i></i></div>
  <div id="hdr"><div id="chap"></div><div id="brand"></div></div>
  <div id="scn"></div>
  <div id="sub"><span></span></div>
  <div id="bar"></div>
  <div id="ccap"></div>
  <div id="cflash"></div>
</div></div>
<div id="ctl">
  <button id="bPS" title="上一场景 (↑ / PgUp)">⏮</button>
  <button id="bP" title="上一句 (←)">‹</button>
  <button id="bPlay" class="main" title="播放 / 暂停 (空格)">▶</button>
  <button id="bN" title="下一句 (→)">›</button>
  <button id="bNS" title="下一场景 (↓ / PgDn)">⏭</button>
  <div id="prog"><i></i></div>
  <span id="time">0:00 / 0:00</span>
  <select id="spd" title="速度"><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.1" selected>1.1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
  <label title="录制的旁白 (N)"><input type="checkbox" id="narr" checked> 旁白</label>
  <label title="人声美化：更温暖、更有磁性 (B)"><input type="checkbox" id="vpol" checked> 美化</label>
  <label title="使用浏览器语音朗读字幕 (V)"><input type="checkbox" id="voice"> 朗读</label>
  <label title="开头的高光快剪"><input type="checkbox" id="cold" checked> 片头</label>
  <label title="背景音乐 (M)"><input type="checkbox" id="bgm" checked> 音乐</label>
  <label title="音效 (S)"><input type="checkbox" id="sfx" checked> 音效</label>
  <button id="bClean" title="隐藏控件，便于录屏 (H)">隐藏控件</button>
  <button id="bFull" title="全屏 (F)">全屏</button>
  <button id="bRec" class="main" title="录制整片并导出 1080p MP4">导出MP4</button>
</div>

<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>

<script>
const C={red:'#D5112A',redL:'rgba(246,38,52,.1)',dark:'#24262D',gray:'#5F687E',mute:'rgba(95,104,126,.62)',line:'#E0E2E8',light:'rgba(224,226,232,.5)',
  blue:'#028EED',blueL:'rgba(2,142,237,.1)',green:'#00AD93',greenL:'rgba(0,173,147,.1)',amber:'#FFA900',amberL:'rgba(255,169,0,.1)',orange:'#FA5146'};
document.getElementById('defs').innerHTML=['red','dark','gray','blue','green','orange','amber'].map(k=>
  `<marker id="ah-${k}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${C[k]}"/></marker>`).join('');

/* ---------- drawing helpers ---------- */
const tw=(s,z)=>{let w=0;for(const ch of s)w+=/[\x00-\xff]/.test(ch)?z*.56:z;return w};
const R=(at,inner,fx='up',o={})=>`<g class="r ${fx}" data-at="${at}"${o.out!=null?` data-out="${o.out}"`:''} style="transition-delay:${o.d||0}s;--d:${o.d||0}s">${inner}</g>`;
const T=(x,y,s,o={})=>{const z=o.size||36,ls=String(s).split('\n'),lh=z*1.3;
  const tt=(o.w||400)>=600;
  return `<text${tt?' class="tt"':''} x="${x}" y="${y}" font-size="${z}" fill="${o.fill||C.dark}" font-weight="${tt?500:400}" text-anchor="${o.a==='start'?'start':o.a==='end'?'end':'middle'}" dominant-baseline="central"${o.ls?` letter-spacing="${o.ls}"`:''}>${ls.map((l,i)=>`<tspan x="${x}" dy="${i?lh:-(ls.length-1)/2*lh}">${l}</tspan>`).join('')}</text>`};
const B=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx??18}" fill="${o.fill||'#fff'}" stroke="${o.stroke||C.line}" stroke-width="${o.sw||3}"${o.dash?' stroke-dasharray="14 10"':''}${(o.fill||'#fff')==='#fff'||o.cls?` class="${(o.fill||'#fff')==='#fff'?'card ':''}${o.cls||''}"`:''}${o.add?` data-add="${o.add}"`:''}/>`
  +(o.t?T(x+w/2,y+h/2-(o.s?20:0),o.t,{size:o.ts||38,w:700,fill:o.tc||C.dark}):'')
  +(o.s?T(x+w/2,y+h/2+28,o.s,{size:o.ss||26,fill:o.sc||C.gray}):'');
const A=(d,o={})=>{const c=o.c||'dark';
  return `<path d="${d}"${o.flow?' class="flow"':o.dash?' class="dashline"':' class="dr" pathLength="1"'} fill="none" stroke="${C[c]}" stroke-width="${o.sw||5}" stroke-linecap="round" stroke-linejoin="round"${o.noHead?'':` marker-end="url(#ah-${c})"`}${o.both?` marker-start="url(#ah-${c})"`:''}/>`};   // both: two-way arrow
const L=(d,o={})=>A(d,{...o,noHead:1});
const P=(x,y,s,o={})=>{const z=o.size||30,h=z*1.9,w=tw(s,z)+z*1.6;
  return `<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${o.fill||C.light}" stroke="${o.stroke||'none'}" stroke-width="3"/>`+T(x,y,s,{size:z,w:700,fill:o.c||C.dark})};
const g=(x,y,inner,s=1)=>`<g transform="translate(${x},${y})${s!==1?` scale(${s})`:''}">${inner}</g>`;
const wv=(x0,y0,w,a,cyc,n=0)=>{let d='';for(let i=0;i<=80;i++){const t=i/80;const v=Math.sin(t*cyc*2*Math.PI)+n*Math.sin(t*cyc*7.3)+n*.6*Math.sin(t*cyc*13.1+1);d+=(i?'L':'M')+(x0+t*w).toFixed(1)+','+(y0-a*v).toFixed(1)}return d};
const star=(R1,r,n)=>{let d='';for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rr=i%2?r:R1;d+=(i?'L':'M')+(Math.cos(a)*rr).toFixed(1)+','+(Math.sin(a)*rr).toFixed(1)}return d+'Z'};

const ecu=(x,y,o={})=>{const s=o.s||1;
  const pins=[-60,-30,0,30,60].map(p=>`<rect x="${p-6}" y="-84" width="12" height="22" rx="3" fill="rgba(95,104,126,.62)"/><rect x="${p-6}" y="62" width="12" height="22" rx="3" fill="rgba(95,104,126,.62)"/>`).join('');
  return g(x,y,`${pins}<rect x="-100" y="-66" width="200" height="132" rx="16" fill="${o.fill||C.dark}"${o.stroke?` stroke="${o.stroke}" stroke-width="6"`:''}/><rect x="-40" y="-40" width="80" height="80" rx="10" fill="#3C4655" stroke="#5F687E" stroke-width="3"/>${T(0,0,o.icon||'ECU',{size:o.icon?44:24,fill:'#fff',w:800})}`,s)
   +(o.label?T(x,y+86*s+32,o.label,{size:o.lz||32,w:700,fill:o.lc||C.dark}):'')+(o.sub?T(x,y+86*s+74,o.sub,{size:26,fill:C.gray}):'')};
/* AC controller: an automotive ECU — finned aluminium housing, mounting ears, two black harness connectors, label sticker */
const acCtrl=(x,y,label)=>{
  const holes=(x0,w,cols)=>[0,1,2].map(r=>Array.from({length:cols},(_,c)=>`<rect x="${x0+12+c*(w-24)/cols+2}" y="${14+r*14}" width="${(w-24)/cols-6}" height="7" rx="2" fill="#5F687E"/>`).join('')).join('');
  return g(x,y,
    [[-1,-58],[1,-58],[-1,52],[1,52]].map(([k,cy])=>`<rect x="${k>0?140:-176}" y="${cy-16}" width="36" height="32" rx="8" fill="#E0E2E8" stroke="#5F687E" stroke-width="3"/><circle cx="${k*162}" cy="${cy}" r="7" fill="#fff" stroke="#5F687E" stroke-width="3"/>`).join('')
   +`<rect x="-150" y="-86" width="300" height="172" rx="14" fill="#E0E2E8" stroke="#5F687E" stroke-width="4"/>`
   +Array.from({length:14},(_,i)=>`<rect x="${-134+i*20}" y="-74" width="8" height="54" rx="4" fill="#fff"/>`).join('')
   +`<rect x="28" y="-70" width="100" height="38" rx="4" fill="#fff" stroke="#5F687E" stroke-width="2"/><rect x="28" y="-70" width="100" height="10" rx="3" fill="${C.red}"/>`+T(52,-44,'❄',{size:18,fill:C.blue})+`<rect x="66" y="-49" width="52" height="5" rx="2" fill="#5F687E"/>`
   +`<rect x="-136" y="-8" width="150" height="80" rx="8" fill="${C.dark}"/><rect x="-82" y="-16" width="42" height="12" rx="4" fill="${C.dark}"/>`+holes(-136,150,6).replace(/y="(\d+)"/g,(m,v)=>`y="${+v-6}"`)
   +`<rect x="26" y="-8" width="110" height="80" rx="8" fill="${C.dark}"/><rect x="60" y="-16" width="42" height="12" rx="4" fill="${C.dark}"/>`+holes(26,110,4).replace(/y="(\d+)"/g,(m,v)=>`y="${+v-6}"`))
   +T(x,y+128,label,{size:32,w:700,fill:C.red})};
/* bare hardware: a circuit board with an unlabeled chip, traces and a few components */
/* board traces, all starting at the chip and running outward */
const pcbTraces=()=>[-30,-15,0,15,30].flatMap(p=>[`M${p},-48 V${p%30?-62:-72} H${p*2.6}`,`M${p},48 V${p%30?62:72} H${p*2.6}`])
  .concat(['M-48,-15 H-80 V-40 H-105','M-48,15 H-90 V40','M48,0 H95 V-30','M48,-30 H70']);
const pcb=(x,y,s=1)=>{const pins=[-30,-15,0,15,30];
  return g(x,y,`<rect x="-140" y="-95" width="280" height="190" rx="14" fill="#00AD93"/>`
   +[[-122,-77],[122,-77],[-122,77],[122,77]].map(([cx,cy])=>`<circle cx="${cx}" cy="${cy}" r="8" fill="#fff" stroke="#3C4655" stroke-width="3"/>`).join('')
   +`<g stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".55">`
   +pcbTraces().map(d=>`<path d="${d}"/>`).join('')+`</g>`
   +pins.map(p=>`<rect x="${p-4}" y="-56" width="8" height="12" fill="#E0E2E8"/><rect x="${p-4}" y="44" width="8" height="12" fill="#E0E2E8"/><rect x="-56" y="${p-4}" width="12" height="8" fill="#E0E2E8"/><rect x="44" y="${p-4}" width="12" height="8" fill="#E0E2E8"/>`).join('')
   +`<rect x="-46" y="-46" width="92" height="92" rx="8" fill="#24262D"/><circle cx="-30" cy="-30" r="5" fill="#5F687E"/>`
   +`<rect x="78" y="44" width="34" height="16" rx="3" fill="#FFA900"/><rect x="78" y="20" width="34" height="16" rx="3" fill="#FFA900"/>`
   +`<circle cx="-95" cy="20" r="13" fill="#3C4655"/><circle cx="-95" cy="20" r="6" fill="#E0E2E8"/><rect x="-112" y="44" width="30" height="20" rx="3" fill="#24262D"/>`,s)};
/* other controllers on the network: same board look as the SUT, but static and simplified (board, chip, corner holes) */
const pcbMini=(x,y,s=1)=>g(x,y,`<rect x="-140" y="-95" width="280" height="190" rx="18" fill="#00AD93"/>`
  +[[-118,-73],[118,-73],[-118,73],[118,73]].map(([cx,cy])=>`<circle cx="${cx}" cy="${cy}" r="9" fill="#fff"/>`).join('')
  +[-24,0,24].map(p=>`<rect x="${p-5}" y="-62" width="10" height="14" rx="2" fill="#fff"/><rect x="${p-5}" y="48" width="10" height="14" rx="2" fill="#fff"/><rect x="-62" y="${p-5}" width="14" height="10" rx="2" fill="#fff"/><rect x="48" y="${p-5}" width="14" height="10" rx="2" fill="#fff"/>`).join('')
  +`<rect x="-48" y="-48" width="96" height="96" rx="12" fill="#24262D"/>`,s);
/* the SUT as it looks at the end of the SUT scene: board + code window on the chip, running (typing code, signal pulses, blinking LED) */
const sut=(x,y,s=1)=>g(x,y,pcb(0,0,1)
  +pcbTraces().map((d,i)=>`<path class="sig" style="animation-delay:${(-(i%5)*.24).toFixed(2)}s" d="${d}"/>`).join('')
  +`<g transform="scale(.3)"><rect x="-180" y="-130" width="360" height="260" rx="18" fill="#24262D"/>`
  +[0,1,2].map(i=>`<circle cx="${-150+i*24}" cy="-104" r="7" fill="${['#FA5146','#FFA900','#00AD93'][i]}"/>`).join('')
  +`<g class="code run">`+[[-140,-60,180,'#33D3FF'],[-110,-20,220,'#9B46EA'],[-110,20,150,'#00AD93'],[-140,60,240,'#FFA900'],[-110,100,120,'#33D3FF']].map(([bx,by,w,c],i)=>`<rect class="cl" style="animation-delay:${(i*.25).toFixed(2)}s" x="${bx}" y="${by-8}" width="${w}" height="16" rx="8" fill="${c}"/>`).join('')+`</g></g>`
  +`<circle class="led" cx="100" cy="-78" r="9" fill="#95C33E"/>`,s);
const CARBODY='M-200,30 L-200,-8 Q-196,-30 -160,-36 L-105,-42 L-55,-88 L75,-88 L140,-42 L182,-32 Q200,-26 200,0 L200,30 Z',CARWIN='M-88,-42 L-48,-76 L2,-76 L2,-42 Z M18,-42 L18,-76 L70,-76 L118,-42 Z';
/* simulation model: a monitor whose screen shows the simulated car (blue dashed outline, as in the 尽早验证 scene) */
const simCar=(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})" fill="none" stroke="${C.blue}" stroke-width="${(3/s).toFixed(1)}" stroke-dasharray="${(8/s).toFixed(1)} ${(5.5/s).toFixed(1)}" stroke-linejoin="round"><path d="${CARBODY}" fill="#fff"/><path d="${CARWIN}"/>${[-118,118].map(cx=>`<circle cx="${cx}" cy="32" r="30" fill="#fff"/>`).join('')}</g>`;
const simModel=(x,y)=>g(x,y,`<rect x="-118" y="-88" width="236" height="160" rx="16" fill="#24262D"/><rect x="-104" y="-74" width="208" height="132" rx="8" fill="${C.blueL}"/>`
  +simCar(0,-2,.42)+`<rect x="-12" y="72" width="24" height="22" fill="#3C4655"/><rect x="-56" y="92" width="112" height="12" rx="6" fill="#3C4655"/>`);
/* a clean cartoon hand (white glove with dark outline, no arm), fingertip at (0,0):
   .hp pointing down (flick / release), .hg closed grab */
const HAND2=(()=>{const st='fill="#fff" stroke="#24262D" stroke-width="4" stroke-linejoin="round"';
  const point=`<g transform="rotate(180)"><rect x="-9" y="-2" width="18" height="48" rx="9" ${st}/>`
    +`<path d="M-9,34 Q-9,26 -2,26 L30,26 Q40,26 40,38 L40,64 Q40,84 20,84 L4,84 Q-14,84 -18,66 L-24,50 Q-27,41 -19,39 Q-12,38 -9,46 Z" ${st}/>`
    +`<path d="M9,27 V40 M21,27 V42 M31,29 V42" stroke="#24262D" stroke-width="3" stroke-linecap="round"/></g>`;
  const grab=`<path d="M-30,-58 Q-30,-70 -18,-70 L18,-70 Q30,-70 30,-58 L30,-14 Q30,6 10,6 L-10,6 Q-30,6 -30,-14 Z" ${st}/>`
    +`<path d="M-15,-6 V6 M0,-6 V6 M15,-6 V6" stroke="#24262D" stroke-width="3" stroke-linecap="round"/>`
    +`<path d="M-30,-40 Q-44,-40 -42,-24 Q-40,-12 -26,-14" ${st}/>`;
  return `<g transform="scale(1.5)" style="filter:drop-shadow(0 6px 10px rgba(36,38,45,.18))"><g class="hp">${point}</g><g class="hg">${grab}</g></g>`})();
const car=(x,y,o={})=>{const gh=o.ghost,st=gh?`fill="none" stroke="${C.mute}" stroke-width="4" stroke-dasharray="12 9"`:`fill="${o.fill||C.red}"`,wh=gh?st:`fill="${C.dark}"`;
  return g(x,y,`<path d="M-200,30 L-200,-8 Q-196,-30 -160,-36 L-105,-42 L-55,-88 L75,-88 L140,-42 L182,-32 Q200,-26 200,0 L200,30 Z" ${st}/>`
   +(gh?'':`<path d="M-88,-42 L-48,-76 L2,-76 L2,-42 Z M18,-42 L18,-76 L70,-76 L118,-42 Z" fill="#fff"/>`)
   +`<circle cx="-118" cy="32" r="30" ${wh}/><circle cx="118" cy="32" r="30" ${wh}/>`
   +(gh?'':`<circle cx="-118" cy="32" r="11" fill="#E0E2E8"/><circle cx="118" cy="32" r="11" fill="#E0E2E8"/>`),o.s||1)};
const thermo=(x,y)=>g(x,y,`<rect x="-24" y="-250" width="48" height="290" rx="24" fill="#fff" stroke="${C.line}" stroke-width="4"/>`
  +[0,1,2,3,4,5,6].map(i=>`<line x1="28" x2="42" y1="${-i*35+5}" y2="${-i*35+5}" stroke="${C.mute}" stroke-width="3"/>`).join('')
  +`<rect id="merc" x="-12" y="-176" width="24" height="206" rx="12" fill="${C.red}"/><circle cy="58" r="44" fill="${C.red}"/>`);
const sun=(x,y)=>g(x,y,`<g class="spin"><circle r="112" fill="none"/>${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return `<line x1="${(Math.cos(a)*80).toFixed(1)}" y1="${(Math.sin(a)*80).toFixed(1)}" x2="${(Math.cos(a)*108).toFixed(1)}" y2="${(Math.sin(a)*108).toFixed(1)}" stroke="#FFA900" stroke-width="9" stroke-linecap="round"/>`}).join('')}</g><circle r="62" fill="#FFA900"/>`);
const fan=(x,y,r)=>g(x,y,`<circle r="${r}" fill="${C.blueL}" stroke="${C.blue}" stroke-width="5"/><g class="spin fast"><circle r="${r*.85}" fill="none"/>${[0,120,240].map(a=>`<ellipse cy="${-r*.42}" rx="${r*.17}" ry="${r*.4}" fill="${C.blue}" transform="rotate(${a})"/>`).join('')}</g><circle r="${r*.12}" fill="${C.dark}"/>`);
const person=(x,y,s=1,c=C.dark)=>g(x,y,`<circle cy="-58" r="26" fill="${c}"/><path d="M-46,40 Q-46,-22 0,-22 Q46,-22 46,40 Z" fill="${c}"/>`,s);
/* friendly colour versions for the air-con story: a driver with skin tone and an indigo shirt, a light touch panel,
   and a light controller chip with a blue core */
const driver=(x,y,s=1)=>g(x,y,`<path d="M-46,40 Q-46,-22 0,-22 Q46,-22 46,40 Z" fill="#433FC3"/><circle cy="-58" r="26" fill="#433FC3"/>`,s);   // abstract pictogram person
const panelLight=(x,y)=>g(x,y,`<rect class="card" x="-130" y="-100" width="260" height="200" rx="22" fill="#fff" stroke="${C.line}" stroke-width="3"/><rect x="-108" y="-80" width="216" height="110" rx="14" fill="${C.blueL}"/>`
  +T(0,-58,'设定温度',{size:22,fill:C.gray})+T(0,-12,'22°C',{size:56,w:800,fill:C.blue})
  +`<circle cx="-50" cy="62" r="20" fill="${C.light}" stroke="${C.line}" stroke-width="2"/><circle cx="50" cy="62" r="20" fill="${C.light}" stroke="${C.line}" stroke-width="2"/>`
  +T(-50,60,'−',{size:30,fill:C.dark})+T(50,60,'+',{size:30,fill:C.dark}))+T(x,y+140,'空调控制面板',{size:30,w:700});
const ecuLight=(x,y,label)=>g(x,y,[-60,-30,0,30,60].map(p=>`<rect x="${p-6}" y="-84" width="12" height="22" rx="3" fill="rgba(95,104,126,.62)"/><rect x="${p-6}" y="62" width="12" height="22" rx="3" fill="rgba(95,104,126,.62)"/>`).join('')
  +`<rect class="card" x="-100" y="-66" width="200" height="132" rx="18" fill="#fff" stroke="${C.blue}" stroke-width="5"/><rect x="-40" y="-40" width="80" height="80" rx="14" fill="${C.blue}"/>`+T(0,0,'❄',{size:44,fill:'#fff',w:800}))
  +T(x,y+118,label,{size:32,w:700});
/* the air-con chain as one consistent icon set: every step is a pastel rounded tile with a duotone icon and a label */
const tile=(x,y,bg,inner,label)=>g(x,y,`<rect class="card" x="-92" y="-92" width="184" height="184" rx="40" fill="${bg}"/>`+inner)+T(x,y+128,label,{size:30,w:700});
/* panel display shows #setT (set by the scene hook); the − button (#btnMinus) gets pressed to lower the set temperature */
const icoPanel=`<rect x="-62" y="-50" width="124" height="74" rx="14" fill="#fff" stroke="#00AD93" stroke-width="4"/><text id="setT" class="tt" x="0" y="-13" font-size="34" font-weight="500" fill="#00AD93" text-anchor="middle" dominant-baseline="central">28°C</text>`
  +`<circle id="pressRing" cx="-24" cy="48" r="13" fill="none" stroke="#00AD93" stroke-width="3" opacity="0"/>`
  +`<g id="btnMinus" class="btnp"><circle cx="-24" cy="48" r="13" fill="#00AD93"/>`+T(-24,47,'−',{size:22,w:800,fill:'#fff'})+`</g>`
  +`<circle cx="24" cy="48" r="13" fill="#00AD93"/>`+T(24,47,'+',{size:22,w:800,fill:'#fff'});
const icoChip=[-36,-12,12,36].map(p=>`<rect x="${p-5}" y="-62" width="10" height="16" rx="3" fill="rgba(246,38,52,.42)"/><rect x="${p-5}" y="46" width="10" height="16" rx="3" fill="rgba(246,38,52,.42)"/>`).join('')
  +`<rect x="-58" y="-48" width="116" height="96" rx="16" fill="#fff" stroke="${C.red}" stroke-width="5"/><rect x="-26" y="-26" width="52" height="52" rx="10" fill="${C.red}"/>`+T(0,0,'❄',{size:32,fill:'#fff',w:800});

 /* "HIL" expands into "Hardware-In-the-Loop": the red H/I/L slide apart while the rest of each word grows in */
 hook:(ci,root)=>{const gx=root.querySelector('#hilx');
   if(!gx._built){gx._built=1;const parts=['H','ardware-','I','n-the-','L','oop'];
     /* hidden while measuring, and no transition until the collapsed "HIL" state is set */
     gx.style.visibility='hidden';gx.classList.add('hxinit');
     gx.innerHTML=parts.map((p,i)=>`<text class="tt hx${i%2?' hxf':''}" y="90" font-size="80" font-weight="500" fill="${i%2?C.dark:C.red}" dominant-baseline="central">${p}</text>`).join('');
     const els=[...gx.children],w=els.map(e=>e.getComputedTextLength()),gap=26;
     let fx=960-w.reduce((a,b)=>a+b,0)/2,ix=960-(w[0]+w[2]+w[4]+gap*2)/2,last=ix;
     els.forEach((e,i)=>{e.setAttribute('x',fx);
       if(i%2){e.style.transform=`translate(${last-fx}px,0) scaleX(0)`;e.style.opacity=0}
       else{e.style.transform=`translate(${ix-fx}px,0)`;last=ix+w[i];ix+=w[i]+gap}
       fx+=w[i]});
     gx.getBoundingClientRect();gx.classList.remove('hxinit');gx.style.visibility=''}
   const expand=()=>gx.querySelectorAll('.hx').forEach(e=>{e.style.transform='none';e.style.opacity=1});
   clearTimeout(gx._t);if(ci===0)gx._t=setTimeout(expand,700/speed);else expand()},   // expands as "Hardware-in-the-Loop" is spoken

/* ---------- sound: adaptive tech music + sound effects ----------
   Everything is synthesised live with Web Audio (no audio files).
   Style: modern, minimal, friendly light electronics for an automotive-software explainer: a soft detuned pad with a
   slowly moving filter, a quiet bouncy synth sequence with digital echo, a soft sub bass, occasional digital
   sparkles and a clear but soft-toned upbeat groove (round kick, warm clap on 2 & 4, gentle shaker; no harsh hi-hats).
   No lead melody, so it never competes with the narration. The air-conditioning story (hot summer, open/closed loop)
   switches to a warmer, everyday sound: electric-piano chords over a walking bass with a lighter snap groove.
   It follows the picture:
   - energy (0–3) is set per line from how much animates: a static line lets the music recede (sequence filter
     closes, bass drops out, the groove thins to kick + clap); new modules / data flows open the filter, add an
     off-beat pluck layer and a fuller shaker pattern;
   - key concepts and conclusions get a short lift (riser + shimmer + two brighter bars);
   - scene changes use a short musical transition (soft swell + filter dip + low downbeat) instead of a hard cut;
   - each scene picks a harmonic colour (intro, explain, life, bright, tense, thought, outro); it changes at the next bar.
   Effects are small digital accents: a soft blip (at most one per line), a two-tone chime for a check mark, a low
   tone for a cross, a soft pulse for a warning sign, glitch clicks for bugs, a filtered sub drop for explosions,

/* mood of each scene: by chapter, with the accident cases tense, the air-conditioning story everyday and the shift-left scene bright */
function sceneMood(s){
  if(s.mood)return s.mood;
  if(s.ch==='开场')return 'intro';
  if(s.ch==='片尾')return 'outro';
  if(/Therac-25|mcoMove|class="rk/.test(s.svg))return 'tense';
  if(s.cues.some(c=>/炎热的夏天|开环控制|打开车窗/.test(c)))return 'life';
  if(s.cues.some(c=>c.includes('测试左移')))return 'bright';
  if(/^02|^结束/.test(s.ch))return 'bright';
  if(/^04/.test(s.ch))return 'thought';
  return 'explain';
}
/* effects for one cue: the scene's own timeline (s.sfx), sounds tagged on newly shown elements (data-sfx), else a soft pop */
/* key concepts / conclusions: chapter title cards and lines that state a definition or a conclusion */
const KEY=/这就是|正是|所谓|即硬件在环|答案是|因此|所以|核心|关键|最重要|不能/;
function cueEnergy(s,ci,shown,added){
  const moving=/class="(sig|flow|spin|cycspin|drive|roadflow)|animateMotion/.test(s.svg)?1:0;
  const n=shown.length+added.length,e=Math.min(3,(n===0?0:n<=2?1:2)+moving);
  music.energy(e,(ci===0&&/font-size="220"/.test(s.svg))||KEY.test(s.cues[ci]||''));
}
function cueSfx(s,ci,shown,added){
  cueEnergy(s,ci,shown,added);
  (s.sfx||[]).filter(x=>x[0]===ci).forEach(([,d,n])=>music.sfx(n,d));
  let n=0,pop=ci>0;   // one soft pop per line at most, none when the scene first appears
  shown.forEach(e=>{const d=parseFloat(e.style.transitionDelay)||0,tags=[...e.querySelectorAll('[data-sfx]:not([data-add])')].map(t=>t.dataset.sfx);   // [data-add] ones sound when their class switches on
    if(tags.length){pop=false;[...new Set(tags)].forEach(t=>{if(n++<8)music.sfx(t,d)})}});
  if(pop&&shown.length)music.sfx('pop',parseFloat(shown[0].style.transitionDelay)||0);
  added.forEach(e=>{if(e.dataset.sfx&&n++<10)music.sfx(e.dataset.sfx,(parseFloat(e.dataset.sfxD)||0)+(parseFloat(e.style.getPropertyValue('--vd'))||0))});
}

  else if(k==='h'||k==='H')clean();else if(k==='f'||k==='F')full();else if(k==='v'||k==='V'){$('voice').click()}else if(k==='n'||k==='N'){$('narr').click()}else if(k==='b'||k==='B'){$('vpol').click()}else if(k==='m'||k==='M'){$('bgm').click()}else if(k==='s'||k==='S'){$('sfx').click()}
  else if(k==='Home')jump(0)});
/* while recording, show the stage at exactly 1920×1080 device pixels when the screen allows (crisp 1080p capture) */
function fit(){const w=$('wrap');let s=Math.min(w.clientWidth/1920,w.clientHeight/1080);if(document.body.classList.contains('rec'))s=Math.min(s,1/devicePixelRatio);stage.style.transform=`translate(-50%,-50%) scale(${s})`}

/* ---------- export: record the whole video (picture + narration + music + effects) to a 1080p 16:9 MP4 ----------
   Uses the browser's own tab capture: step 1 goes full screen, step 2 (a fresh click) asks to share this tab with its
   audio, crops the capture to the stage, scales it to 1920×1080 at 30 fps, plays the video from the start and saves
   the file when it ends. Recording runs in real time (≈ the video length). */
const REC_TYPES=['video/mp4;codecs="avc1.640028,mp4a.40.2"','video/mp4','video/webm;codecs=vp9,opus'];
let recorder=null;
function recDialog(){
  if(recorder)return;
  const box=document.createElement('div');box.id='recBox';
  box.innerHTML=`<div class="card"><h3>导出 1080p MP4</h3>
    <ol><li>点击「开始录制」后，在浏览器弹窗中选择<b>此标签页</b>，并勾选<b>分享标签页音频</b>。</li>
    <li>视频会从头自动播放并录制（约 ${fmt(total)}），期间请不要切换窗口或操作页面。</li>
    <li>播放结束后自动保存为 <b>什么是HIL测试_1080p.mp4</b>。</li></ol>
    <button class="go">开始录制</button><button class="no">取消</button><div class="msg"></div></div>`;
  document.body.appendChild(box);
  if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
  document.body.classList.add('rec');setTimeout(fit,300);
  const close=()=>{box.remove();if(!recorder){document.body.classList.remove('rec');fit()}};
  box.querySelector('.no').onclick=close;
  box.querySelector('.go').onclick=async()=>{
    const msg=box.querySelector('.msg');
    music.warm();if(narrOn)voiceChain();   // unlock music + voice audio now, while this click still counts as a user gesture
    try{
      setPlaying(false);
      const stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30,displaySurface:'browser'},audio:{suppressLocalAudioPlayback:false},
        preferCurrentTab:true,selfBrowserSurface:'include',surfaceSwitching:'exclude',systemAudio:'include'});
      const [vt]=stream.getVideoTracks();
      if(!stream.getAudioTracks().length)msg.textContent='提示：未勾选“分享标签页音频”，导出的视频将没有声音。';
      box.remove();fit();await new Promise(r=>setTimeout(r,400));
      if(window.CropTarget&&vt.cropTo)await vt.cropTo(await CropTarget.fromElement(stage));
      await vt.applyConstraints({width:1920,height:1080,frameRate:30}).catch(()=>{});
      const type=REC_TYPES.find(t=>MediaRecorder.isTypeSupported(t));
      const chunks=[];recorder=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:12e6,audioBitsPerSecond:192e3,videoKeyFrameIntervalDuration:1000});
      recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
      recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const ext=type.startsWith('video/mp4')?'mp4':'webm';
        const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type}));a.download=`什么是HIL测试_1080p.${ext}`;a.click();
        recorder=null;document.body.classList.remove('rec');if(document.fullscreenElement)document.exitFullscreen();fit()};
      vt.onended=()=>recorder&&recorder.state==='recording'&&(setPlaying(false),recorder.stop());   // sharing stopped by the user
      if(coldIn())coldLeave();pos=0;cur=-1;scn.innerHTML='';subT.textContent='';chap.textContent='';stage.classList.add('white');   // start from a blank white frame, like a fresh load
      await new Promise(r=>setTimeout(r,500));
      recorder.start(1000);await new Promise(r=>setTimeout(r,600));
      setPlaying(true);
    }catch(e){msg.textContent='未开始录制：'+(e.message||e);recorder=null}
  };
}
$('bRec').onclick=recDialog;
addEventListener('resize',fit);fit();
/* on load show a blank white stage (nothing animates yet), so screen recording can be started first; Play / Space then starts the opening */
stage.classList.add('white');chap.textContent='';$('time').textContent=`0:00 / ${fmt(total)}`;
</script>
